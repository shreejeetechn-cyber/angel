name: Build Safety APKs

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'safety_tool/**'
      - '.github/workflows/build-safety-apks.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build client APK
        run: gradle -p safety_tool/client assembleDebug --stacktrace
      - name: Build server APK
        run: gradle -p safety_tool/server assembleDebug --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p out
          cp safety_tool/client/app/build/outputs/apk/debug/app-debug.apk out/SafetyClient.apk
          cp safety_tool/server/app/build/outputs/apk/debug/app-debug.apk out/SafetyServerViewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: safety-apks
          path: out/*.apk
